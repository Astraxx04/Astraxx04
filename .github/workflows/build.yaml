name: Profile build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race each other for the same ref.
concurrency:
  group: profile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Regenerate and push
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            go run .

            git add dark_mode.svg light_mode.svg
            if git diff --staged --quiet; then
              echo "no changes"
              exit 0
            fi
            git commit -m "chore: refresh profile"

            if git push; then
              exit 0
            fi

            # Someone pushed while we were working. Drop our commit, take their
            # main, and regenerate on top of it — the SVGs are fully generated,
            # so there is nothing of ours worth merging.
            echo "push rejected, retrying on top of origin/main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
          done

          echo "push failed after 3 attempts" >&2
          exit 1
